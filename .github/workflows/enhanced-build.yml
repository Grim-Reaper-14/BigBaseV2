name: GTA V Enhanced Build

on:
  push:
    branches:
      - feature/new-menu-base
      - feature/enhanced-imgui192
  pull_request:
  workflow_dispatch:

jobs:
  build-enhanced:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Premake 5
        shell: powershell
        run: |
          $version = "5.0.0-beta8"
          $archive = "$env:RUNNER_TEMP\premake.zip"
          $directory = "$env:RUNNER_TEMP\premake"
          Invoke-WebRequest `
            -Uri "https://github.com/premake/premake-core/releases/download/v$version/premake-$version-windows.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Synchronize vendor dependencies
        shell: powershell
        run: |
          .\scripts\update-vendors.ps1 `
            -ImGuiVersion "v1.92.8" `
            -FmtVersion "12.1.0" `
            -JsonVersion "v3.12.0" `
            -MinHookVersion "v1.3.4" `
            -StackWalkerCommit "7af402408202a5c00021fd57e18e39e7e6f11062" `
            -Sol2Version "v3.3.0" `
            -LuaVersion "5.4.8"

      - name: Synchronize Enhanced native table
        shell: powershell
        run: |
          py tools/natives/sync_yimmenuv2_crossmap.py `
            --output BigBaseV2/src/crossmap_enhanced.hpp `
            --source-ref "YimMenu/YimMenuV2:enhanced"

      - name: Generate JOAAT vehicle catalog
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          py scripts/generate_vehicle_catalog.py `
            --output BigBaseV2/src/menu/pages/vehicle_catalog_generated.hpp `
            --expected-count 921

      - name: Validate generated Enhanced data
        shell: powershell
        run: |
          $crossmap = "BigBaseV2/src/crossmap_enhanced.hpp"
          if (-not (Test-Path $crossmap)) {
            throw "crossmap_enhanced.hpp was not generated"
          }
          $crossmapContent = Get-Content $crossmap -Raw
          if ($crossmapContent -notmatch "std::array<rage::scrNativeHash, 6720>") {
            throw "Generated native table does not contain 6720 hashes"
          }
          $nativeHashCount = ([regex]::Matches($crossmapContent, "0x[0-9A-Fa-f]{1,16}")).Count
          if ($nativeHashCount -ne 6720) {
            throw "Expected 6720 native hashes but found $nativeHashCount"
          }

          $vehicleCatalog = "BigBaseV2/src/menu/pages/vehicle_catalog_generated.hpp"
          if (-not (Test-Path $vehicleCatalog)) {
            throw "vehicle_catalog_generated.hpp was not generated"
          }
          $vehicleContent = Get-Content $vehicleCatalog -Raw
          if ($vehicleContent -notmatch "std::array<vehicle_catalog_entry, 921>") {
            throw "Generated vehicle catalog does not contain 921 entries"
          }
          if ($vehicleContent -notmatch "source-blob: 2ccc0b29cc3729609f03994f57078622bb0fe5d9") {
            throw "Generated vehicle catalog is not pinned to the approved blob"
          }
          $vehicleEntryCount = ([regex]::Matches($vehicleContent, '\{0x[0-9A-F]{8}u, "[a-z0-9_]+"\},')).Count
          if ($vehicleEntryCount -ne 921) {
            throw "Expected 921 JOAAT vehicle entries but found $vehicleEntryCount"
          }

      - name: Generate Visual Studio solution
        shell: powershell
        run: premake5 vs2022

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Debug x64
        shell: powershell
        run: msbuild BigBaseV2.sln /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal
