name: GTA V Enhanced DX12 Build

on:
  push:
    branches:
      - feature/new-menu-base
      - feature/enhanced-imgui192
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-dx12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-enhanced:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Premake 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = "5.0.0-beta8"
          $archive = "$env:RUNNER_TEMP\premake.zip"
          $directory = "$env:RUNNER_TEMP\premake"
          Invoke-WebRequest `
            -Uri "https://github.com/premake/premake-core/releases/download/v$version/premake-$version-windows.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Enhanced Debug x64
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\scripts\build-enhanced.ps1 `
            -Configuration Debug `
            -Generator vs2022

      - name: Upload Enhanced build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: BigBaseV2-Enhanced-DX12-Debug-${{ github.sha }}
          path: |
            bin/Debug/BigBaseV2.dll
            bin/Debug/BigBaseV2.pdb
          if-no-files-found: error
          retention-days: 7
